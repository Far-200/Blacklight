version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blacklight
      POSTGRES_PASSWORD: blacklight
      POSTGRES_DB: blacklight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blacklight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://blacklight:blacklight@postgres:5432/blacklight
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # NOTE (Phase 0 scope): the Kali sandbox container is intentionally not wired up
  # yet. It lands in Phase 1 (/sandbox) once the scope gate above is working and
  # tested — nothing in this repo should reach the sandbox without going through
  # app/scope_gate/service.py first.

volumes:
  postgres_data:
